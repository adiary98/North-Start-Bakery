<main>
<h1>Contact Us</h1>
<p>Send a question or pre-order request.</p>
<form action="#" method="get">
<fieldset>
<legend>Your Request</legend>
<p><label for="name">Name:</label> <input id="name" name="name" required></p>
<p><label for="email">Email:</label> <input id="email" name="email" type="email" required></p>
<p><label for="date">Pickup date:</label> <input id="date" name="date" type="date"></p>
<p><label for="type">Request type:</label>
<select id="type" name="type" required>
<option value="">Choose one</option>
<option value="preorder">Pre-order</option>
<option value="question">General question</option>
</select></p>
<p><label for="items">Item details:</label> <textarea id="items" name="items"></textarea></p>
<p><label for="allergies">Allergy notes (optional):</label> <textarea id="allergies" name="allergies"></textarea></p>
</fieldset>
<button type="submit">Submit</button>
</form>
<h2>Location and Hours</h2>
<p>123 Main Street (sample address). Monday to Saturday, 7 AM to 5 PM.</p>
</main>
<footer><p>North Star Bakery</p></footer>
</body>
</html>
